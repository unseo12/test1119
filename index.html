<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIMBAP HEAVEN | 오늘 뭐 먹지?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #eeeae2;
            color: #20242a;
            font-family: "Pretendard", sans-serif;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           전체 앱
        ========================= */

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: #fffdf8;
        }

        /* =========================
           헤더
        ========================= */

        .header {
            height: 72px;
            padding: 0 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #fffdf8;
            border-bottom: 1px solid #eee8dd;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;

            color: #17202a;
            text-decoration: none;

            font-size: 12px;
            line-height: 1.05;
            letter-spacing: 0.06em;
        }

        .logo-mark {
            font-size: 30px;
        }

        .logo b {
            font-size: 15px;
            letter-spacing: 0.12em;
        }

        .cart-button {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #17202a;
            color: white;

            font-size: 18px;

            position: relative;
        }

        .cart-count {
            position: absolute;

            top: -4px;
            right: -3px;

            min-width: 18px;
            height: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #d94b3d;
            color: white;

            font-size: 10px;
            font-weight: 800;
        }

        /* =========================
           페이지
        ========================= */

        .page {
            display: none;
            padding-bottom: 100px;
        }

        .page.active {
            display: block;
        }

        /* =========================
           홈 히어로
        ========================= */

        .hero {
            margin: 18px;

            padding: 32px 25px;

            border-radius: 24px;

            background: #17202a;
            color: white;

            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "🍙";

            position: absolute;

            right: -10px;
            bottom: -25px;

            font-size: 130px;
            opacity: 0.08;

            transform: rotate(-12deg);
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #d94b3d;
        }

        .hero .eyebrow {
            color: #f4c542;
        }

        .hero h1 {
            margin: 13px 0;

            font-family: "Jua", sans-serif;
            font-size: 34px;
            font-weight: 400;
            line-height: 1.25;
        }

        .hero h1 em {
            color: #f4c542;
            font-style: normal;
        }

        .hero p {
            margin-bottom: 22px;

            color: #d9dde0;

            font-size: 13px;
            line-height: 1.6;
        }

        /* =========================
           버튼
        ========================= */

        .primary-button {
            border: none;
            border-radius: 13px;

            padding: 14px 19px;

            background: #f4c542;
            color: #17202a;

            font-size: 14px;
            font-weight: 800;

            transition: 0.2s;
        }

        .primary-button:hover {
            transform: translateY(-2px);
        }

        .full-button {
            width: 100%;
        }

        /* =========================
           검색창
        ========================= */

        .search-box {
            height: 52px;

            margin: 18px;

            padding: 0 16px;

            display: flex;
            align-items: center;
            gap: 9px;

            border: 1px solid #e7e0d5;
            border-radius: 14px;

            background: white;

            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }

        .search-icon {
            font-size: 23px;
            color: #888;
        }

        .search-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            font-size: 14px;
        }

        /* =========================
           섹션
        ========================= */

        .content-section {
            padding: 0 18px;
        }

        .section-title {
            margin-bottom: 13px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title h2 {
            font-size: 20px;
        }

        .more-button {
            border: none;
            background: none;

            color: #888;

            font-size: 12px;
        }

        /* =========================
           카테고리
        ========================= */

        .category-list {
            display: flex;
            gap: 7px;

            overflow-x: auto;

            padding-bottom: 7px;

            scrollbar-width: none;
        }

        .category-list::-webkit-scrollbar {
            display: none;
        }

        .category {
            flex-shrink: 0;

            padding: 9px 14px;

            border: 1px solid #e8e1d7;
            border-radius: 20px;

            background: white;

            color: #666;

            font-size: 12px;
        }

        .category.active {
            background: #17202a;
            color: white;
            border-color: #17202a;
        }

        /* =========================
           메뉴 카드
        ========================= */

        .menu-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;

            margin-top: 13px;
        }

        .menu-card {
            overflow: hidden;

            border: 1px solid #eee7dc;
            border-radius: 17px;

            background: white;

            transition: 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-3px);

            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .food-image {
            height: 145px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff0bd;

            font-size: 70px;
        }

        .menu-card:nth-child(even) .food-image {
            background: #fce0d9;
        }

        .menu-info {
            padding: 13px;
        }

        .menu-info h3 {
            margin-bottom: 5px;

            font-size: 14px;
        }

        .menu-info p {
            margin-bottom: 9px;

            color: #999;

            font-size: 10px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price {
            font-size: 13px;
            font-weight: 800;
        }

        /* =========================
           추천 카드
        ========================= */

        .recommend-card {
            margin: 26px 18px;

            padding: 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-radius: 20px;

            background: #f4c542;
        }

        .recommend-card span {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.1em;
        }

        .recommend-card h3 {
            margin: 8px 0 5px;

            font-family: "Jua", sans-serif;
            font-size: 21px;
            font-weight: 400;
        }

        .recommend-card p {
            color: #534a2c;

            font-size: 11px;
            line-height: 1.5;
        }

        .round-button {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #17202a;
            color: white;

            font-size: 18px;
        }

        /* =========================
           페이지 제목
        ========================= */

        .page-heading {
            padding: 30px 20px 0;
        }

        .page-heading h1 {
            margin: 10px 0 7px;

            font-family: "Jua", sans-serif;
            font-size: 38px;
            font-weight: 400;
        }

        .page-heading p {
            margin-bottom: 18px;

            color: #888;

            font-size: 13px;
        }

        /* =========================
           뒤로가기
        ========================= */

        .back-button {
            margin: 24px 20px 8px;

            border: none;
            background: none;

            color: #777;

            font-size: 13px;
        }

        /* =========================
           메뉴 상세
        ========================= */

        .detail {
            padding: 0 20px;
        }

        .detail-image {
            height: 300px;

            margin-top: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: #fff0bd;

            font-size: 130px;
        }

        .detail h1 {
            margin: 24px 0 6px;

            font-family: "Jua", sans-serif;
            font-size: 34px;
            font-weight: 400;
        }

        .detail-price {
            font-size: 20px;
            font-weight: 800;
        }

        .detail-description {
            margin: 16px 0 22px;

            color: #777;

            font-size: 13px;
            line-height: 1.7;
        }

        .detail-info {
            padding: 18px 0;

            margin-bottom: 22px;

            border-top: 1px solid #eee5d9;
            border-bottom: 1px solid #eee5d9;
        }

        .detail-info p {
            margin: 7px 0;

            color: #777;

            font-size: 12px;
        }

        /* =========================
           추천 페이지
        ========================= */

        .recommend-page {
            padding: 28px 20px;
        }

        .recommend-page h1 {
            margin: 13px 0 10px;

            font-family: "Jua", sans-serif;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.25;
        }

        .recommend-page > p {
            color: #888;

            font-size: 13px;
            line-height: 1.6;
        }

        .choice-list {
            display: grid;
            gap: 10px;

            margin: 25px 0;
        }

        .choice {
            padding: 16px;

            display: grid;
            grid-template-columns: 35px 1fr;

            align-items: center;

            border: 1px solid #e7e0d5;
            border-radius: 16px;

            background: white;

            text-align: left;
        }

        .choice.selected {
            border: 2px solid #17202a;
            background: #fff9e6;
        }

        .choice b {
            font-size: 14px;
        }

        .choice small {
            grid-column: 2;

            margin-top: 3px;

            color: #999;
        }

        .result-card {
            margin-top: 20px;

            padding: 22px;

            border-radius: 20px;

            background: #17202a;
            color: white;
        }

        .result-card .food-image {
            height: 170px;

            margin-bottom: 17px;

            border-radius: 14px;
        }

        .result-card h2 {
            margin: 10px 0 5px;

            font-family: "Jua", sans-serif;
            font-size: 27px;
            font-weight: 400;
        }

        .result-card p {
            margin-bottom: 10px;

            color: #ccd0d4;

            font-size: 12px;
        }

        /* =========================
           장바구니
        ========================= */

        .cart-wrap {
            padding: 0 20px;
        }

        .cart-item {
            padding: 16px 0;

            display: flex;
            align-items: center;
            gap: 13px;

            border-bottom: 1px solid #eee7dd;
        }

        .cart-thumb {
            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #fff0c8;

            font-size: 36px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item h3 {
            margin-bottom: 5px;

            font-size: 14px;
        }

        .cart-item p {
            color: #999;

            font-size: 12px;
        }

        .quantity {
            margin-top: 8px;

            display: flex;
            align-items: center;
            gap: 9px;
        }

        .quantity button {
            width: 24px;
            height: 24px;

            border: 1px solid #ddd;
            border-radius: 50%;

            background: white;
        }

        .empty-cart {
            padding: 70px 20px;

            text-align: center;

            color: #999;
        }

        .empty-cart-icon {
            margin-bottom: 15px;

            font-size: 60px;
        }

        .total-box {
            margin: 20px;

            padding: 20px;

            display: flex;
            justify-content: space-between;

            border-radius: 16px;

            background: #f5f1e9;

            font-size: 13px;
        }

        .total-box strong {
            font-size: 20px;
        }

        /* =========================
           하단 네비게이션
        ========================= */

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 100%;
            max-width: 480px;

            height: 75px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            padding: 7px 8px;

            background: rgba(255,253,249,0.95);

            backdrop-filter: blur(15px);

            border-top: 1px solid #eee7dd;

            z-index: 20;
        }

        .nav-item {
            border: none;
            background: none;

            color: #999;

            font-size: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 5px;
        }

        .nav-item span {
            font-size: 19px;
        }

        .nav-item.active {
            color: #17202a;
            font-weight: 800;
        }

        /* =========================
           반응형
        ========================= */

        @media (min-width: 700px) {

            body {
                padding: 30px 0;
            }

            .app {
                border-radius: 25px;
                overflow: hidden;

                box-shadow: 0 10px 50px rgba(0,0,0,0.12);
            }

            .bottom-nav {
                position: relative;

                left: auto;
                transform: none;

                width: 100%;
            }
        }

    </style>
</head>


<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <a href="#" class="logo" onclick="showPage('home')">

            <span class="logo-mark">🍙</span>

            <span>
                KIMBAP<br>
                <b>HEAVEN</b>
            </span>

        </a>

        <button class="cart-button" onclick="showPage('cart')">

            🛒

            <span class="cart-count" id="cartCount">
                0
            </span>

        </button>

    </header>


    <!-- =========================
         HOME
    ========================= -->

    <section class="page active" id="homePage">

        <div class="hero">

            <span class="eyebrow">
                YOUR EVERYDAY KOREAN MEAL
            </span>

            <h1>
                오늘 뭐 먹지?<br>
                <em>김밥천국에서 골라봐!</em>
            </h1>

            <p>
                익숙하지만 더 편리하게.<br>
                지금 먹고 싶은 메뉴를 찾아보세요.
            </p>

            <button
                class="primary-button"
                onclick="showPage('recommend')">

                ✨ 오늘 뭐 먹지?

            </button>

        </div>


        <!-- 검색 -->

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="homeSearch"
                placeholder="메뉴를 검색해보세요"
                oninput="searchMenu(this.value)"
            >

        </div>


        <!-- 메뉴 -->

        <section class="content-section">

            <div class="section-title">

                <h2>
                    오늘의 메뉴
                </h2>

                <button
                    class="more-button"
                    onclick="showPage('menu')">

                    전체보기 →

                </button>

            </div>


            <div
                class="category-list"
                id="homeCategories">

                <button
                    class="category active"
                    onclick="filterHome('전체', this)">

                    전체

                </button>

                <button
                    class="category"
                    onclick="filterHome('김밥', this)">

                    🍙 김밥

                </button>

                <button
                    class="category"
                    onclick="filterHome('면', this)">

                    🍜 면

                </button>

                <button
                    class="category"
                    onclick="filterHome('밥', this)">

                    🍚 밥

                </button>

                <button
                    class="category"
                    onclick="filterHome('분식', this)">

                    🥟 분식

                </button>

            </div>


            <div
                class="menu-grid"
                id="homeMenu">

            </div>

        </section>


        <!-- 추천 카드 -->

        <div class="recommend-card">

            <div>

                <span>
                    KIMBAP HEAVEN TIP
                </span>

                <h3>
                    메뉴가 너무 많다면?
                </h3>

                <p>
                    취향을 선택하고<br>
                    오늘의 메뉴를 추천받아보세요.
                </p>

            </div>

            <button
                class="round-button"
                onclick="showPage('recommend')">

                →

            </button>

        </div>

    </section>


    <!-- =========================
         MENU
    ========================= -->

    <section class="page" id="menuPage">

        <div class="page-heading">

            <span class="eyebrow">
                MENU
            </span>

            <h1>
                메뉴
            </h1>

            <p>
                먹고 싶은 메뉴를 빠르게 찾아보세요.
            </p>

        </div>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="menuSearch"
                placeholder="김밥, 라면, 떡볶이..."
                oninput="renderMenuPage()"
            >

        </div>


        <div
            class="category-list"
            id="menuCategories"
            style="padding:0 18px 10px;">

            <button
                class="category active"
                onclick="setCategory('전체', this)">

                전체

            </button>

            <button
                class="category"
                onclick="setCategory('김밥', this)">

                🍙 김밥

            </button>

            <button
                class="category"
                onclick="setCategory('면', this)">

                🍜 면

            </button>

            <button
                class="category"
                onclick="setCategory('밥', this)">

                🍚 밥

            </button>

            <button
                class="category"
                onclick="setCategory('분식', this)">

                🥟 분식

            </button>

        </div>


        <div
            class="menu-grid"
            id="allMenu"
            style="padding:0 18px;">

        </div>

    </section>


    <!-- =========================
         DETAIL
    ========================= -->

    <section class="page" id="detailPage">

        <button
            class="back-button"
            onclick="showPage('menu')">

            ← 메뉴로 돌아가기

        </button>


        <div
            class="detail"
            id="detailContent">

        </div>

    </section>


    <!-- =========================
         RECOMMEND
    ========================= -->

    <section class="page" id="recommendPage">

        <div class="recommend-page">

            <span class="eyebrow">
                TODAY'S PICK
            </span>

            <h1>
                오늘은 어떤 메뉴가<br>
                먹고 싶나요?
            </h1>

            <p>
                하나만 골라도 딱 맞는 메뉴를<br>
                찾아드릴게요.
            </p>


            <div class="choice-list">

                <button
                    class="choice"
                    onclick="selectMood('든든하게', this)">

                    🍚

                    <b>
                        든든하게
                    </b>

                    <small>
                        배부르게 한 끼!
                    </small>

                </button>


                <button
                    class="choice"
                    onclick="selectMood('매콤하게', this)">

                    🌶️

                    <b>
                        매콤하게
                    </b>

                    <small>
                        스트레스엔 매운맛!
                    </small>

                </button>


                <button
                    class="choice"
                    onclick="selectMood('가볍게', this)">

                    🥬

                    <b>
                        가볍게
                    </b>

                    <small>
                        부담 없이 깔끔하게
                    </small>

                </button>


                <button
                    class="choice"
                    onclick="selectMood('저렴하게', this)">

                    💸

                    <b>
                        저렴하게
                    </b>

                    <small>
                        5,000원 이하로!
                    </small>

                </button>

            </div>


            <button
                class="primary-button full-button"
                onclick="recommendMenu()">

                메뉴 추천받기 →

            </button>


            <div id="recommendResult"></div>

        </div>

    </section>


    <!-- =========================
         CART
    ========================= -->

    <section class="page" id="cartPage">

        <div class="page-heading">

            <span class="eyebrow">
                MY ORDER
            </span>

            <h1>
                장바구니
            </h1>

            <p>
                주문할 메뉴를 확인해주세요.
            </p>

        </div>


        <div id="cartContent"></div>

    </section>


    <!-- =========================
         BOTTOM NAV
    ========================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item active"
            onclick="showPage('home')">

            <span>⌂</span>
            홈

        </button>


        <button
            class="nav-item"
            onclick="showPage('menu')">

            <span>🍙</span>
            메뉴

        </button>


        <button
            class="nav-item"
            onclick="showPage('recommend')">

            <span>✨</span>
            추천

        </button>


        <button
            class="nav-item"
            onclick="showPage('cart')">

            <span>🛒</span>
            장바구니

        </button>

    </nav>

</div>


<script>

    /* =========================
       메뉴 데이터
    ========================= */

    const menus = [

        {
            id: 1,
            name: "원조김밥",
            category: "김밥",
            price: 3500,
            emoji: "🍙",
            description: "김밥천국의 기본이 되는 담백하고 친숙한 김밥",
            moods: ["가볍게", "저렴하게"]
        },

        {
            id: 2,
            name: "참치김밥",
            category: "김밥",
            price: 4500,
            emoji: "🍙",
            description: "참치와 고소한 마요네즈가 어우러진 인기 메뉴",
            moods: ["든든하게", "저렴하게"]
        },

        {
            id: 3,
            name: "치즈김밥",
            category: "김밥",
            price: 4500,
            emoji: "🧀",
            description: "고소한 치즈가 들어간 부드러운 김밥",
            moods: ["가볍게", "저렴하게"]
        },

        {
            id: 4,
            name: "라면",
            category: "면",
            price: 4000,
            emoji: "🍜",
            description: "따끈하고 얼큰한 국물의 대표 메뉴",
            moods: ["매콤하게", "저렴하게"]
        },

        {
            id: 5,
            name: "떡볶이",
            category: "분식",
            price: 4500,
            emoji: "🥘",
            description: "달콤매콤한 양념에 쫄깃한 떡을 더한 분식",
            moods: ["매콤하게", "저렴하게"]
        },

        {
            id: 6,
            name: "참치볶음밥",
            category: "밥",
            price: 6000,
            emoji: "🍳",
            description: "고소한 참치와 볶음밥의 든든한 한 끼",
            moods: ["든든하게"]
        },

        {
            id: 7,
            name: "제육덮밥",
            category: "밥",
            price: 6500,
            emoji: "🍚",
            description: "매콤달콤한 제육을 밥 위에 푸짐하게",
            moods: ["든든하게", "매콤하게"]
        },

        {
            id: 8,
            name: "돈까스",
            category: "분식",
            price: 7000,
            emoji: "🍛",
            description: "바삭하게 튀겨낸 든든한 돈까스",
            moods: ["든든하게"]
        }

    ];


    /* =========================
       상태
    ========================= */

    let cart = [];

    let selectedCategory = "전체";

    let selectedMood = "";


    /* =========================
       가격 표시
    ========================= */

    function money(price) {

        return "₩" + price.toLocaleString("ko-KR");

    }


    /* =========================
       메뉴 카드
    ========================= */

    function menuCard(menu) {

        return `

            <article
                class="menu-card"
                onclick="showDetail(${menu.id})">

                <div class="food-image">
                    ${menu.emoji}
                </div>

                <div class="menu-info">

                    <h3>
                        ${menu.name}
                    </h3>

                    <p>
                        ${menu.description}
                    </p>

                    <span class="price">
                        ${money(menu.price)}
                    </span>

                </div>

            </article>

        `;

    }


    /* =========================
       홈 메뉴
    ========================= */

    function renderHomeMenu(list = menus.slice(0, 4)) {

        document.getElementById("homeMenu").innerHTML =
            list.map(menuCard).join("");

    }


    /* =========================
       홈 카테고리
    ========================= */

    function filterHome(category, button) {

        document
            .querySelectorAll("#homeCategories .category")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        if (category === "전체") {

            renderHomeMenu(menus.slice(0, 4));

        } else {

            renderHomeMenu(
                menus.filter(menu => menu.category === category)
            );

        }

    }


    /* =========================
       메뉴 페이지
    ========================= */

    function setCategory(category, button) {

        selectedCategory = category;

        document
            .querySelectorAll("#menuCategories .category")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        renderMenuPage();

    }


    function renderMenuPage() {

        const keyword =
            document
                .getElementById("menuSearch")
                .value
                .toLowerCase();


        const result = menus.filter(menu => {

            const categoryMatch =
                selectedCategory === "전체" ||
                menu.category === selectedCategory;

            const searchMatch =
                menu.name.toLowerCase().includes(keyword);

            return categoryMatch && searchMatch;

        });


        const container =
            document.getElementById("allMenu");


        if (result.length === 0) {

            container.innerHTML = `

                <div
                    class="empty-cart"
                    style="grid-column:1/-1;">

                    <div class="empty-cart-icon">
                        🥲
                    </div>

                    <p>
                        검색 결과가 없어요.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML =
            result.map(menuCard).join("");

    }


    /* =========================
       검색
    ========================= */

    function searchMenu(keyword) {

        showPage("menu");

        document.getElementById("menuSearch").value =
            keyword;

        renderMenuPage();

    }


    /* =========================
       상세 페이지
    ========================= */

    function showDetail(id) {

        const menu =
            menus.find(item => item.id === id);


        document.getElementById("detailContent").innerHTML = `

            <div class="detail">

                <div class="detail-image">
                    ${menu.emoji}
                </div>


                <h1>
                    ${menu.name}
                </h1>


                <div class="detail-price">
                    ${money(menu.price)}
                </div>


                <p class="detail-description">
                    ${menu.description}.<br>
                    누구나 편하게 즐길 수 있는
                    김밥천국의 인기 메뉴입니다.
                </p>


                <div class="detail-info">

                    <p>
                        <b>카테고리</b>
                        ${menu.category}
                    </p>

                    <p>
                        <b>알레르기 정보</b>
                        매장별 원재료 확인 필요
                    </p>

                </div>


                <button
                    class="primary-button full-button"
                    onclick="addToCart(${menu.id})">

                    🛒 장바구니 담기

                </button>

            </div>

        `;


        showPage("detail");

    }


    /* =========================
       장바구니 추가
    ========================= */

    function addToCart(id) {

        const existing =
            cart.find(item => item.id === id);


        if (existing) {

            existing.quantity++;

        } else {

            cart.push({
                id: id,
                quantity: 1
            });

        }


        updateCart();


        alert("장바구니에 담았어요! 🍙");

    }


    /* =========================
       장바구니 업데이트
    ========================= */

    function updateCart() {

        const count =
            cart.reduce(
                (sum, item) => sum + item.quantity,
                0
            );


        document.getElementById("cartCount").textContent =
            count;


        renderCart();

    }


    /* =========================
       수량 변경
    ========================= */

    function changeQuantity(id, amount) {

        const item =
            cart.find(item => item.id === id);


        item.quantity += amount;


        if (item.quantity <= 0) {

            cart =
                cart.filter(item => item.id !== id);

        }


        updateCart();

    }


    /* =========================
       장바구니 화면
    ========================= */

    function renderCart() {

        const container =
            document.getElementById("cartContent");


        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty-cart">

                    <div class="empty-cart-icon">
                        🛒
                    </div>

                    <h3>
                        장바구니가 비어있어요
                    </h3>

                    <p style="margin:10px 0 20px;">
                        마음에 드는 메뉴를 담아보세요.
                    </p>

                    <button
                        class="primary-button"
                        onclick="showPage('menu')">

                        메뉴 보러가기

                    </button>

                </div>

            `;

            return;

        }


        let total = 0;


        let html = `

            <div class="cart-wrap">

        `;


        cart.forEach(item => {

            const menu =
                menus.find(menu => menu.id === item.id);


            const itemTotal =
                menu.price * item.quantity;


            total += itemTotal;


            html += `

                <div class="cart-item">

                    <div class="cart-thumb">
                        ${menu.emoji}
                    </div>


                    <div class="cart-item-info">

                        <h3>
                            ${menu.name}
                        </h3>

                        <p>
                            ${money(menu.price)}
                        </p>


                        <div class="quantity">

                            <button
                                onclick="changeQuantity(${menu.id}, -1)">

                                −

                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${menu.id}, 1)">

                                +

                            </button>

                        </div>

                    </div>


                    <strong>
                        ${money(itemTotal)}
                    </strong>

                </div>

            `;

        });


        html += `

            </div>


            <div class="total-box">

                <span>
                    총 금액
                </span>

                <strong>
                    ${money(total)}
                </strong>

            </div>


            <div style="padding:0 20px;">

                <button
                    class="primary-button full-button"
                    onclick="orderComplete()">

                    주문하기 →

                </button>

            </div>

        `;


        container.innerHTML = html;

    }


    /* =========================
       추천 기능
    ========================= */

    function selectMood(mood, button) {

        selectedMood = mood;


        document
            .querySelectorAll(".choice")
            .forEach(item =>
                item.classList.remove("selected")
            );


        button.classList.add("selected");

    }


    function recommendMenu() {

        if (!selectedMood) {

            alert("먼저 원하는 메뉴 스타일을 골라주세요! 🍙");

            return;

        }


        const candidates =
            menus.filter(menu =>
                menu.moods.includes(selectedMood)
            );


        const menu =
            candidates[
                Math.floor(
                    Math.random() * candidates.length
                )
            ];


        document.getElementById(
            "recommendResult"
        ).innerHTML = `

            <div class="result-card">

                <div class="food-image">
                    ${menu.emoji}
                </div>

                <span
                    class="eyebrow"
                    style="color:#f4c542;">

                    TODAY'S PICK

                </span>


                <h2>
                    ${menu.name}
                </h2>


                <p>
                    ${menu.description}
                </p>


                <strong>
                    ${money(menu.price)}
                </strong>


                <br><br>


                <button
                    class="primary-button"
                    onclick="addToCart(${menu.id})">

                    장바구니 담기

                </button>

            </div>

        `;

    }


    /* =========================
       페이지 이동
    ========================= */

    function showPage(page) {

        document
            .querySelectorAll(".page")
            .forEach(section =>
                section.classList.remove("active")
            );


        document
            .getElementById(page + "Page")
            .classList.add("active");


        document
            .querySelectorAll(".nav-item")
            .forEach(button =>
                button.classList.remove("active")
            );


        const navButtons =
            document.querySelectorAll(".nav-item");


        if (page === "home")
            navButtons[0].classList.add("active");

        if (page === "menu")
            navButtons[1].classList.add("active");

        if (page === "recommend")
            navButtons[2].classList.add("active");

        if (page === "cart")
            navButtons[3].classList.add("active");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        if (page === "menu") {

            renderMenuPage();

        }


        if (page === "cart") {

            renderCart();

        }

    }


    /* =========================
       주문 완료
    ========================= */

    function orderComplete() {

        if (cart.length === 0) {

            alert("장바구니가 비어있어요!");

            return;

        }


        alert(
            "주문이 완료되었습니다! 🍙\n\n맛있게 드세요!"
        );


        cart = [];


        updateCart();


        showPage("home");

    }


    /* =========================
       초기 실행
    ========================= */

    renderHomeMenu();

    renderMenuPage();

    updateCart();

</script>

</body>
</html>
